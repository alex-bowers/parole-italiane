<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parole italiane</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main>
      <div class="brand">Parole <i>italiane</i></div>

      <section>
        <div class="mode">
          <button class="active" data-mode="easy">Easy <small>— pick Italian</small></button>
          <button data-mode="normal">Normal <small>— type English</small></button>
          <button data-mode="hard">Hard <small>— type Italian</small></button>
        </div>

        <div class="deck">
          <button class="active" data-deck="word">Words</button>
          <button data-deck="sentence">Sentences</button>
          <button data-deck="mixed">Mixed</button>
        </div>
      </section>

      <section class="card">
        <p class="label" id="prompt">English → Italian</p>
        <div class="question" id="question">Loading…</div>
        <div id="play"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next" id="next" hidden>
          Next <span aria-hidden="true">→</span>
        </button>
      </section>

      <details class="manage">
        <summary>Add to your list</summary>
        <p>Your additions are stored permanently in your Cloudflare KV namespace.</p>

        <form class="add" id="add">
          <input name="english" aria-label="English translation" placeholder="English">
          <input name="italian" aria-label="Italian translation" placeholder="Italian">
          <select name="type" aria-label="Entry type">
            <option value="word">Word</option>
            <option value="sentence">Sentence</option>
          </select>
          <button>Add</button>
        </form>

        <div class="note" id="note"></div>
      </details>
    </main>
  </body>
</html>
