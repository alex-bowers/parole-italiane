<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Parole">
    <meta name="description" content="A simple Italian vocabulary game.">
    <title>Parole italiane</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <header class="page-header">
        <button class="back" id="back" type="button" hidden><span aria-hidden="true">←</span> Main menu</button>
        <h1 class="brand" id="page-title">Parole <i>italiane</i></h1>
      </header>

      <section class="screen" id="menu-screen" aria-labelledby="menu-heading">
        <h2 id="menu-heading">Choose an activity</h2>
        <div class="activity-picker">
          <button data-activity="choice"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg> Multiple choice</button>
          <button data-activity="translate"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M18 10h.01M7 14h.01M11 14h6"/></svg> Translation</button>
          <button data-activity="listen-choice"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/></svg> Listen &amp; choose</button>
          <button data-activity="dictation"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 14a2 2 0 0 1 2-2h1v7H6a2 2 0 0 1-2-2v-3ZM20 14a2 2 0 0 0-2-2h-1v7h1a2 2 0 0 0 2-2v-3Z"/></svg> Listen &amp; type</button>
          <button data-activity="pronunciation"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg> Pronunciation</button>
          <button data-activity="matching"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 7h11M15 4l3 3-3 3M17 17H6M9 14l-3 3 3 3"/></svg> Matching</button>
          <button data-activity="sentence-builder"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 5h14M5 9h9M5 15h14M5 19h7"/></svg> Build a sentence</button>
          <button class="add-words-link" id="show-add" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add words</button>
        </div>
      </section>

      <section class="screen" id="game-screen" aria-label="Game" hidden>
        <div class="practice-controls" aria-label="Practice settings">
        <p class="control-label">Practise</p>
        <div class="deck">
          <button class="active" data-deck="word">Words</button>
          <button data-deck="sentence">Sentences</button>
          <button data-deck="mixed">Mixed</button>
        </div>

        <div class="direction" id="direction-control" hidden>
          <button class="active" data-direction="english-italian">English → Italian</button>
          <button data-direction="italian-english">Italian → English</button>
        </div>
        </div>

        <section class="card">
          <p class="label" id="prompt">English → Italian</p>
          <div class="question" id="question">Loading…</div>
          <div id="play"></div>
          <div class="feedback" id="feedback"></div>
          <button class="next" id="next" type="button" hidden>
            Next <span aria-hidden="true">→</span>
          </button>
        </section>
      </section>

      <section class="screen manage" id="add-screen" aria-label="Add words" hidden>
        <p>Your additions are stored permanently in your Cloudflare KV namespace.</p>

        <form class="add" id="add">
          <input name="english" aria-label="English translation" placeholder="English">
          <input name="italian" aria-label="Italian translation" placeholder="Italian">
          <select name="type" aria-label="Entry type">
            <option value="word">Word</option>
            <option value="sentence">Sentence</option>
          </select>
          <button>Add</button>
        </form>

        <div class="note" id="note"></div>
      </section>
    </main>
  </body>
</html>
