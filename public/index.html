<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0f0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Parole">
    <meta name="description" content="A simple Italian vocabulary game.">
    <title>Parole italiane</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <main>
      <div class="brand">Parole <i>italiane</i></div>

      <section class="practice-controls" aria-label="Practice settings">
        <h1>Choose an activity</h1>
        <div class="activity-picker">
          <button class="active" data-activity="choice"><span aria-hidden="true">✓</span> Multiple choice</button>
          <button data-activity="translate"><span aria-hidden="true">⌨</span> Translation</button>
          <button data-activity="listen-choice"><span aria-hidden="true">🔊</span> Listen &amp; choose</button>
          <button data-activity="dictation"><span aria-hidden="true">🎧</span> Listen &amp; type</button>
          <button data-activity="pronunciation"><span aria-hidden="true">🎙</span> Pronunciation</button>
          <button data-activity="matching"><span aria-hidden="true">↔</span> Matching</button>
          <button data-activity="sentence-builder"><span aria-hidden="true">▤</span> Build a sentence</button>
        </div>

        <p class="control-label">Practise</p>
        <div class="deck">
          <button class="active" data-deck="word">Words</button>
          <button data-deck="sentence">Sentences</button>
          <button data-deck="mixed">Mixed</button>
        </div>

        <div class="direction" id="direction-control" hidden>
          <button class="active" data-direction="english-italian">English → Italian</button>
          <button data-direction="italian-english">Italian → English</button>
        </div>
      </section>

      <section class="card">
        <p class="label" id="prompt">English → Italian</p>
        <div class="question" id="question">Loading…</div>
        <div id="play"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next" id="next" type="button" hidden>
          Next <span aria-hidden="true">→</span>
        </button>
      </section>

      <details class="manage">
        <summary>Add to your list</summary>
        <p>Your additions are stored permanently in your Cloudflare KV namespace.</p>

        <form class="add" id="add">
          <input name="english" aria-label="English translation" placeholder="English">
          <input name="italian" aria-label="Italian translation" placeholder="Italian">
          <select name="type" aria-label="Entry type">
            <option value="word">Word</option>
            <option value="sentence">Sentence</option>
          </select>
          <button>Add</button>
        </form>

        <div class="note" id="note"></div>
      </details>
    </main>
  </body>
</html>
